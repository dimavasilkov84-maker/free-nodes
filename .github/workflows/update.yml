name: Auto Update Nodes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fresh nodes
        run: |
          curl -s "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/vless.txt" > nodes.txt
          curl -s "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/top100.txt" >> nodes.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes.txt
          git commit -m "Auto update nodes" || exit 0
          git push
